name: PR Checks

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@main
      - uses: tanh-lab/ci-actions/clang-format-check@main
        with:
          SOURCES: "src/ include/"

  # Verify the committed .clang-* files still match the pinned tanh-tooling release.
  clang-config:
    uses: tanh-lab/tanh-tooling/.github/workflows/clang-check.yml@v0.1.4
    with:
      ref: v0.1.4

  build-and-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-24.04
            preset: desktop-debug
          - name: macOS-arm64
            os: macos-15
            preset: desktop-debug
          - name: macOS-x86_64
            os: macos-15
            preset: macos-x64-debug
          - name: Windows-x86_64
            os: windows-2025
            preset: windows-debug
          - name: iOS-Simulator
            os: macos-26
            preset: ios-simulator-debug
          - name: Android-x86_64
            os: ubuntu-24.04
            preset: android-emulator-debug
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@main
      - uses: nttld/setup-ndk@v1
        if: ${{ contains(matrix.name, 'Android') }}
        with:
          ndk-version: r27b
      - uses: tanh-lab/ci-actions/cmake-build@main
        with:
          PRESET: ${{ matrix.preset }}
      - uses: tanh-lab/ci-actions/clang-tidy-check@main
        if: ${{ matrix.name == 'Linux-x86_64' }}
        with:
          SOURCES: "src/ test/"
          PRESET: ${{ matrix.preset }}
      - uses: tanh-lab/ci-actions/cmake-test@main
        if: ${{ !contains(matrix.name, 'Android') && !contains(matrix.name, 'iOS') }}
        with:
          PRESET: ${{ matrix.preset }}
      - uses: tanh-lab/ci-actions/cmake-test-ios-simulator@main
        if: ${{ contains(matrix.name, 'iOS') }}
        with:
          PRESET: ${{ matrix.preset }}
      - uses: tanh-lab/ci-actions/cmake-test-android@main
        if: ${{ contains(matrix.name, 'Android') }}
        with:
          PRESET: ${{ matrix.preset }}

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android-arm64
            os: ubuntu-24.04
            preset: android-debug
          - name: Windows-ARM64
            os: windows-2025
            preset: windows-arm64-debug
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@main
      - uses: nttld/setup-ndk@v1
        if: ${{ contains(matrix.name, 'Android') }}
        with:
          ndk-version: r27b
      - uses: tanh-lab/ci-actions/cmake-build@main
        with:
          PRESET: ${{ matrix.preset }}

  # Install tree completeness: build + install the core component (the way a
  # permissively licensed embedder consumes it), then build an external project
  # against the prefix with find_package(tanh COMPONENTS Core) and run it.
  install:
    name: Install & Consume (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux-x86_64-shared
            os: ubuntu-24.04
            shared: ON
          - name: Linux-x86_64-static
            os: ubuntu-24.04
            shared: OFF
          - name: macOS-arm64-shared
            os: macos-15
            shared: ON
          - name: Windows-x86_64-shared
            os: windows-2025
            shared: ON
          - name: Windows-x86_64-static
            os: windows-2025
            shared: OFF
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@main
      - name: build and install tanh::Core
        shell: bash
        run: |
          cmake -S . -B build-install -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DTANH_BUILD_STATE=OFF -DTANH_BUILD_DSP=OFF -DTANH_BUILD_MODULATION=OFF -DTANH_BUILD_AUDIO_IO=OFF \
            -DTANH_WITH_TESTS=OFF -DTANH_WITH_EXAMPLES=OFF -DTANH_WITH_DOCS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/prefix"
          cmake --build build-install --parallel
          cmake --install build-install
          find prefix -type f | sort
      - name: build and run the consumer against the prefix
        shell: bash
        run: |
          cmake -S test/install -B build-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/prefix"
          cmake --build build-consumer --parallel
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PATH="${{ github.workspace }}/prefix/bin:$PATH" ./build-consumer/consumer.exe
          else
            ./build-consumer/consumer
          fi

  sanitizer-asan:
    name: ASan/UBSan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@main
      - uses: tanh-lab/ci-actions/cmake-build@main
        with:
          PRESET: desktop-debug-asan
      - uses: tanh-lab/ci-actions/cmake-test@main
        with:
          PRESET: desktop-debug-asan

  sanitizer-tsan:
    name: TSan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@main
      - uses: tanh-lab/ci-actions/cmake-build@main
        with:
          PRESET: desktop-debug-tsan
      - uses: tanh-lab/ci-actions/cmake-test@main
        with:
          PRESET: desktop-debug-tsan

  sanitizer-lsan:
    name: LSan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@main
      - uses: tanh-lab/ci-actions/cmake-build@main
        with:
          PRESET: desktop-debug-lsan
      - uses: tanh-lab/ci-actions/cmake-test@main
        with:
          PRESET: desktop-debug-lsan

  sanitizer-rtsan:
    name: RTSan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@main
      - uses: tanh-lab/ci-actions/cmake-build@main
        with:
          PRESET: desktop-debug-rtsan
      - uses: tanh-lab/ci-actions/cmake-test@main
        with:
          PRESET: desktop-debug-rtsan
