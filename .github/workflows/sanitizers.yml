name: sanitizers

# ASan/UBSan, TSan, LSan and RTSan over the sanitizer presets — the logic lives
# in tanh-lab/ci-actions' reusable build-sanitizer workflow; this file keeps
# only tanh-lib's facts (triggers, the matrix file). The matrix lives in
# .github/sanitizer_matrix.json (see the reusable workflow's header for the row
# schema). Queue-gated: pull requests report only the instant result stub
# (tier policy).
#
# Two things the shared workflow brings that the previous local copy lacked:
# UBSAN_OPTIONS=halt_on_error=1 (UBSan defaults to print-and-continue, so the
# UBSan leg could not fail before), and a clang pin of 20, which
# -fsanitize=realtime requires for the RTSan leg.

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: sanitizers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    if: github.event_name != 'pull_request'
    uses: tanh-lab/ci-actions/.github/workflows/build-sanitizer.yml@v0.3.10
    with:
      matrix_file: .github/sanitizer_matrix.json

  result:
    name: sanitizer result
    needs: sanitize
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ github.event_name }}" = "pull_request" ] && { echo "stub: real run happens in the merge queue"; exit 0; }
          echo "workflow result: ${{ needs.sanitize.result }}"
          [ "${{ needs.sanitize.result }}" = "success" ] || exit 1
