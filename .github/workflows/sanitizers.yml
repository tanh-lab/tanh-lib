name: sanitizers

# ASan/UBSan, TSan, LSan and RTSan over the sanitizer presets. Queue-gated:
# pull requests report only the instant result stub (tier policy).

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: sanitizers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan-UBSan
            preset: desktop-debug-asan
          - name: TSan
            preset: desktop-debug-tsan
          - name: LSan
            preset: desktop-debug-lsan
          - name: RTSan
            preset: desktop-debug-rtsan
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.3
      - uses: tanh-lab/ci-actions/cmake-build@v0.3.3
        with:
          PRESET: ${{ matrix.preset }}
      - uses: tanh-lab/ci-actions/cmake-test@v0.3.3
        with:
          PRESET: ${{ matrix.preset }}

  result:
    name: sanitizer result
    needs: sanitize
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ github.event_name }}" = "pull_request" ] && { echo "stub: real run happens in the merge queue"; exit 0; }
          [ "${{ needs.sanitize.result }}" = "success" ] || exit 1
