name: build_test

# Desktop build + test — the logic is tanh-lab/ci-actions' reusable build-test
# workflow (same as anira); this file keeps only tanh-lib's facts. Pull
# requests run the "pr": true subset; the merge queue runs every leg.

on:
  merge_group:
  workflow_dispatch:
    inputs:
      tier:
        description: "Matrix tier"
        type: choice
        options: ["full", "pr"]
        default: "full"
  pull_request:
    branches:
      - main

concurrency:
  group: build_test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: build_test
    uses: tanh-lab/ci-actions/.github/workflows/build-test.yml@v0.3.6
    with:
      tier: ${{ inputs.tier || '' }}

  # The one status the merge queue requires (called jobs report under a
  # prefixed name, so this job keeps the exact context).
  result:
    name: build_test result
    needs: build_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          echo "workflow result: ${{ needs.build_test.result }}"
          [ "${{ needs.build_test.result }}" = "success" ] || exit 1
