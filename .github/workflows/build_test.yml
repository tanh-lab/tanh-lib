name: build_test

# Desktop build + test — the logic is tanh-lab/ci-actions' reusable build-test
# workflow (same as anira); this file keeps only tanh-lib's facts. Pull
# requests run the "pr": true subset; the merge queue runs every leg.

on:
  merge_group:
  workflow_dispatch:
    inputs:
      tier:
        description: "Matrix tier"
        type: choice
        options: ["full", "pr"]
        default: "full"
  pull_request:
    branches:
      - main

concurrency:
  group: build_test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: build_test
    uses: tanh-lab/ci-actions/.github/workflows/build-test.yml@v0.3.12
    with:
      tier: ${{ inputs.tier || '' }}

  # Modulation without State, the configuration of hosts that bring their own
  # parameter store through a ParameterBackend: State-free tests only.
  modulation_without_state:
    name: modulation without State
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-version.cmake reads the nearest tag
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.12
      - name: build and test
        shell: bash
        run: |
          cmake -S . -B build-no-state -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DTANH_BUILD_STATE=OFF -DTANH_BUILD_MODULATION=ON -DTANH_BUILD_AUDIO_IO=OFF \
            -DTANH_WITH_TESTS=ON -DTANH_WITH_EXAMPLES=OFF -DTANH_WITH_DOCS=OFF
          cmake --build build-no-state --parallel
          ctest --test-dir build-no-state --output-on-failure --parallel 4

  # The one status the merge queue requires (called jobs report under a
  # prefixed name, so this job keeps the exact context).
  result:
    name: build_test result
    needs: [build_test, modulation_without_state]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uses: refs cannot reference a variable, so single-point definition is
      # impossible — assert the next-best property: one ci-actions version repo-wide.
      - name: one ci-actions version repo-wide
        run: |
          test "$(grep -rho 'tanh-lab/ci-actions[^@]*@v[0-9.]*' .github/workflows/ | grep -o 'v[0-9.]*$' | sort -u | wc -l)" -eq 1
      - name: aggregate
        run: |
          echo "workflow result: ${{ needs.build_test.result }}"
          echo "modulation without State: ${{ needs.modulation_without_state.result }}"
          [ "${{ needs.build_test.result }}" = "success" ] || exit 1
          [ "${{ needs.modulation_without_state.result }}" = "success" ] || exit 1
