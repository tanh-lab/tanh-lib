name: coverage

# Full-suite coverage on every push to main — the pipeline is
# tanh-lab/ci-actions' reusable coverage workflow; this file keeps tanh-lib's
# facts. Not queue-gated: a coverage dip is information, never a merge blocker.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # Self-validating: runs on a PR exactly when this workflow itself changes,
  # dormant on every other PR per the tier policy.
  pull_request:
    paths:
      - ".github/workflows/coverage.yml"

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage
    uses: tanh-lab/ci-actions/.github/workflows/coverage.yml@v0.3.3
    permissions:
      contents: read
      id-token: write # Codecov's tokenless OIDC upload
    with:
      preset: desktop-coverage
      lib_pattern: "libtanh_*.so*"
