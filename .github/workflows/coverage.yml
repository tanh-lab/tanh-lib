name: coverage

# Full-suite coverage in the merge queue: the pipeline is tanh-lab/ci-actions'
# reusable coverage workflow (instrumented build, the whole suite, llvm-cov
# export, upload to Codecov); this file keeps tanh-lib's facts.
#
# Not a required check: a coverage dip is information, never a merge blocker,
# and a red run here holds no merge group back. It used to run on every push to
# main. A merge group's head is the commit main moves to, so the queue measures
# the same commit before it lands, and a change that breaks the pipeline (the
# preset, the suite, the export) shows on its own merge group instead of on
# main afterwards.
#
# Codecov and the branch: the README badge reads Codecov's branch main, and an
# upload is filed under the branch the uploader reports. In the queue the ref
# is gh-readonly-queue/main/pr-<n>-<sha>; the Codecov CLI (its GitHub Actions
# adapter; codecov-action fetches the latest CLI) reports such a ref as the
# queue's target branch, so the upload is filed under main, for the commit main
# moves to. A merge group that is dropped after its upload leaves Codecov's
# main one commit ahead of the repository until the next group lands. Should
# the badge ever stop following main, a `push: branches: [main]` trigger here
# brings the old upload back.

on:
  merge_group:
  workflow_dispatch:
  # Self-validating: runs on a PR exactly when this workflow itself changes,
  # dormant on every other PR per the tier policy.
  pull_request:
    paths:
      - ".github/workflows/coverage.yml"

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage
    uses: tanh-lab/ci-actions/.github/workflows/coverage.yml@v0.3.16
    permissions:
      contents: read
      id-token: write # Codecov's tokenless OIDC upload
    with:
      preset: desktop-coverage
      lib_pattern: "libtanh_*.so*"
