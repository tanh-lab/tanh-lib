name: clang_format

# Queue-gated formatting check; pull requests report only the result stub.

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: clang_format-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.5
      - uses: tanh-lab/ci-actions/clang-format-check@v0.3.5
        with:
          SOURCES: "src/ include/"

  result:
    name: clang_format result
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ github.event_name }}" = "pull_request" ] && { echo "stub: real run happens in the merge queue"; exit 0; }
          [ "${{ needs.format.result }}" = "success" ] || exit 1
