name: lint

# clang-format over the sources and the tanh-tooling config drift check.
# Queue-gated: pull requests report only the two instant result stubs. The
# result-job names keep the ruleset's required contexts unchanged.

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: lint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.10
      - uses: tanh-lab/ci-actions/clang-format-check@v0.3.10
        with:
          SOURCES: "src/ include/"

  tooling-config:
    if: github.event_name != 'pull_request'
    uses: tanh-lab/tanh-tooling/.github/workflows/config-check.yml@v0.2.8
    with:
      ref: v0.2.8
      family: "clang cmake"

  clang_format_result:
    name: clang_format result
    needs: format
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ github.event_name }}" = "pull_request" ] && { echo "stub: real run happens in the merge queue"; exit 0; }
          [ "${{ needs.format.result }}" = "success" ] || exit 1

  clang_check_result:
    name: clang_check result
    needs: tooling-config
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ github.event_name }}" = "pull_request" ] && { echo "stub: real run happens in the merge queue"; exit 0; }
          [ "${{ needs.tooling-config.result }}" = "success" ] || exit 1
