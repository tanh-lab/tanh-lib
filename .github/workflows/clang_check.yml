name: clang_check

# Verify the committed tanh-tooling files (.clang-*, cmake/tanh/) still match
# the pinned release; anira must pin the same tag. Queue-gated; pull requests
# report only the result stub.

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: clang_check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling-config:
    if: github.event_name != 'pull_request'
    uses: tanh-lab/tanh-tooling/.github/workflows/config-check.yml@v0.1.5
    with:
      ref: v0.1.5
      family: "clang cmake"

  result:
    name: clang_check result
    needs: tooling-config
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ github.event_name }}" = "pull_request" ] && { echo "stub: real run happens in the merge queue"; exit 0; }
          [ "${{ needs.tooling-config.result }}" = "success" ] || exit 1
