name: build_install

# Install tree completeness: build + install the core component (the way a
# permissively licensed embedder consumes it), then build an external project
# against the prefix with find_package(tanh COMPONENTS Core) and run it.
# Queue-gated: pull requests report only the instant result stub.

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: build_install-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install / ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux-x86_64-shared
            os: ubuntu-24.04
            shared: ON
          - name: Linux-x86_64-static
            os: ubuntu-24.04
            shared: OFF
          - name: macOS-arm64-shared
            os: macos-15
            shared: ON
          - name: Windows-x86_64-shared
            os: windows-2025
            shared: ON
          - name: Windows-x86_64-static
            os: windows-2025
            shared: OFF
    steps:
      - uses: actions/checkout@v4
      - uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.10
      - name: build and install tanh::Core
        shell: bash
        run: |
          cmake -S . -B build-install -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DTANH_BUILD_STATE=OFF -DTANH_BUILD_DSP=OFF -DTANH_BUILD_MODULATION=OFF -DTANH_BUILD_AUDIO_IO=OFF \
            -DTANH_WITH_TESTS=OFF -DTANH_WITH_EXAMPLES=OFF -DTANH_WITH_DOCS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/prefix"
          cmake --build build-install --parallel
          cmake --install build-install
          find prefix -type f | sort
      - name: build and run the consumer against the prefix
        uses: tanh-lab/ci-actions/install-consume-check@v0.3.10
        with:
          PREFIX: ${{ github.workspace }}/prefix
          CONSUMER_DIR: test/install
          BINARIES: consumer
          GENERATOR: Ninja

  result:
    name: install result
    needs: install
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          [ "${{ github.event_name }}" = "pull_request" ] && { echo "stub: real run happens in the merge queue"; exit 0; }
          [ "${{ needs.install.result }}" = "success" ] || exit 1
